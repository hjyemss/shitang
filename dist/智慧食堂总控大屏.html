  <style>
/* ============================================================
   智慧食堂综合调度中心 · 大屏样式
   设计基调：深色指挥中心 + 细线描边 + 冷色高亮
   所有颜色走 CSS 变量，[data-theme="light"] 下整屏可切换浅色
   ============================================================ */

:root {
  --bg: #060b14;
  --bg-grid: rgba(90, 150, 220, 0.06);
  --panel: #0a1424;
  --panel2: #0e1c30;
  --panel3: #12233a;
  --line: rgba(120, 170, 255, 0.14);
  --line2: rgba(120, 170, 255, 0.26);
  --text: #e8f0fb;
  --muted: #9db2cf;
  --dim: #6b83a4;
  --accent: #38bdf8;
  --accent2: #6366f1;
  --ok: #34d399;
  --warn: #fbbf24;
  --danger: #fb5c72;
  --grid: rgba(120, 170, 255, 0.10);
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --radius: 14px;
  --sidebar-w: 238px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
}

html[data-theme="light"] {
  --bg: #eef3fa;
  --bg-grid: rgba(40, 90, 150, 0.07);
  --panel: #ffffff;
  --panel2: #f5f8fd;
  --panel3: #e9f0fa;
  --line: rgba(30, 70, 120, 0.14);
  --line2: rgba(30, 70, 120, 0.24);
  --text: #0f2135;
  --muted: #4b6178;
  --dim: #7089a3;
  --accent: #0b7fbf;
  --accent2: #4f46e5;
  --ok: #0e9f6e;
  --warn: #b7791f;
  --danger: #d6455d;
  --grid: rgba(30, 70, 120, 0.10);
  --shadow: 0 14px 36px rgba(23, 48, 84, 0.12);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  color: var(--text);
  background:
    radial-gradient(1200px 600px at 78% -10%, rgba(56, 189, 248, 0.10), transparent 60%),
    radial-gradient(900px 500px at 10% 110%, rgba(99, 102, 241, 0.10), transparent 60%),
    linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0 / 42px 42px,
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px) 0 0 / 42px 42px,

  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

.app { display: flex; min-height: 100vh; }

/* ---------------------------------------------------------- 侧边栏 */
.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  border-right: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(12, 24, 41, 0.92), rgba(6, 12, 22, 0.92));
  backdrop-filter: blur(8px);
  padding: 22px 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: auto;
}

html[data-theme="light"] .sidebar {
  background: linear-gradient(180deg, #ffffff, #f2f7fd);
}

.brand { display: flex; align-items: center; gap: 11px; padding: 0 4px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 11px;
  display: grid; place-items: center;
  color: var(--accent);

}
.brand-t { font-size: 15px; font-weight: 700; letter-spacing: 0.4px; }
.brand-s { font-size: 10px; color: var(--dim); letter-spacing: 2.2px; margin-top: 2px; }

.side-label {

}
.side-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-item {

  padding: 10px 12px; border-radius: 10px;
  color: var(--muted); text-decoration: none;
  border: 1px solid transparent;
  font-size: 13.5px;
  transition: background 0.16s, color 0.16s, border-color 0.16s;
}
.nav-item svg { flex: 0 0 auto; opacity: 0.9; }
.nav-item:hover { background: rgba(56, 189, 248, 0.07); color: var(--text); }
.nav-item.active {
  color: var(--text);
  background: linear-gradient(90deg, rgba(56, 189, 248, 0.16), rgba(56, 189, 248, 0.03));
  border-color: var(--line2);
  box-shadow: inset 2px 0 0 var(--accent);
}
.nav-item.active svg { color: var(--accent); }

.status-list { display: flex; flex-direction: column; gap: 2px; }
.status-row {

  font-size: 12px; color: var(--muted);
  padding: 7px 6px; border-bottom: 1px dashed var(--line);
}
.status-row:last-child { border-bottom: none; }
.status-row b { color: var(--text); font-weight: 600; font-size: 11.5px; }

.side-foot { margin-top: auto; font-size: 10.5px; color: var(--dim); line-height: 1.8; padding: 0 6px; }

/* ---------------------------------------------------------- 主区域 */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {

  padding: 12px 26px; border-bottom: 1px solid var(--line);
  background: rgba(6, 12, 22, 0.6);
  backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 20;
}
html[data-theme="light"] .topbar { background: rgba(255, 255, 255, 0.75); }
.topbar .crumb { font-size: 12px; color: var(--dim); letter-spacing: 1px; }
.topbar .crumb b { color: var(--text); font-weight: 600; letter-spacing: 0.5px; }
.topbar .spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: var(--muted);
  padding: 5px 11px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel);
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.16); }
.icon-btn {

}
.icon-btn:hover { color: var(--text); border-color: var(--line2); }

.view { padding: 22px 26px 30px; display: flex; flex-direction: column; gap: 18px; }

/* ---------------------------------------------------------- 横幅 */
.hero {
  position: relative; overflow: hidden;
  border-radius: 18px; border: 1px solid var(--line2);
  background:
    radial-gradient(700px 260px at 88% -30%, rgba(56, 189, 248, 0.30), transparent 65%),
    linear-gradient(115deg, #0b2138 0%, #0d2a44 45%, #10384f 100%);

  padding: 26px 28px;
  display: flex; gap: 24px; align-items: center; justify-content: space-between;
  flex-wrap: wrap;
}
html[data-theme="light"] .hero {
  background:

    linear-gradient(115deg, #0f4c81 0%, #13659f 55%, #16758c 100%);
}
.hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px) 0 0 / 100% 26px;
  opacity: 0.35; pointer-events: none;
}
.hero-main { position: relative; z-index: 1; min-width: 320px; }
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 7px;

  background: rgba(10, 40, 66, 0.45);
  padding: 5px 12px; border-radius: 999px;
}
.hero h1 { margin: 14px 0 8px; font-size: 30px; line-height: 1.2; letter-spacing: 0.5px; color: #f4f9ff; }
.hero p { margin: 0; font-size: 13px; color: #a9c8de; }
.hero-stats { display: flex; gap: 10px; position: relative; z-index: 1; flex-wrap: wrap; }
.hero-stat {

}
.hero-stat .k { font-size: 9.5px; letter-spacing: 1.6px; color: #8fb6d1; }
.hero-stat .v { font-size: 19px; font-weight: 700; color: #f2f9ff; margin: 3px 0 1px; font-variant-numeric: tabular-nums; }
.hero-stat .s { font-size: 10.5px; color: #8fb6d1; }

/* ---------------------------------------------------------- 指标卡 */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: linear-gradient(160deg, var(--panel2), var(--panel));
  padding: 15px 16px 13px; position: relative; overflow: hidden;
}
.kpi::before {
  content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 2px;
  background: linear-gradient(90deg, var(--tone), transparent 70%);
  opacity: 0.8;
}
.kpi-head { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.kpi-ico {
  width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
  color: var(--tone); background: color-mix(in srgb, var(--tone) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--tone) 30%, transparent);
}
.kpi-value { display: flex; align-items: baseline; gap: 5px; margin: 10px 0 8px; }
.kpi-value b { font-size: 30px; line-height: 1; font-weight: 700; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; }
.kpi-value span { font-size: 12px; color: var(--muted); }
.kpi-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; padding: 3px 8px; border-radius: 999px;
  color: var(--tone); border: 1px solid color-mix(in srgb, var(--tone) 32%, transparent);
  background: color-mix(in srgb, var(--tone) 10%, transparent);
}
.kpi-src { font-size: 10.5px; color: var(--dim); }

/* ---------------------------------------------------------- 面板 */
.grid-2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.span-2 { grid-column: span 2; }

.panel {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: linear-gradient(170deg, var(--panel2), var(--panel));
  padding: 16px 18px 14px;
  min-width: 0;
}
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.panel-title { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 650; }
.panel-title svg { color: var(--accent); }
.panel-sub { font-size: 11.5px; color: var(--dim); margin-top: 4px; }
.panel-tag { font-size: 9.5px; letter-spacing: 1.6px; color: var(--dim); white-space: nowrap; padding-top: 4px; }

/* ---------------------------------------------------------- 表格 */
.table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.table th {
  text-align: left; font-weight: 500; color: var(--dim); font-size: 11px;
  letter-spacing: 0.6px; padding: 7px 8px; border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.table td { padding: 9px 8px; border-bottom: 1px dashed var(--line); color: var(--muted); }
.table tr:last-child td { border-bottom: none; }
.table td:first-child { color: var(--text); }
.table .num { text-align: right; font-variant-numeric: tabular-nums; }
.table th.num { text-align: right; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; padding: 2px 9px; border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--tone) 34%, transparent);
  color: var(--tone); background: color-mix(in srgb, var(--tone) 12%, transparent);
}
.tag-ok { --tone: var(--ok); }
.tag-warn { --tone: var(--warn); }
.tag-danger { --tone: var(--danger); }
.tag-info { --tone: var(--accent); }
.tag-muted { --tone: var(--dim); }

/* ---------------------------------------------------------- 告警条 */
.alert {
  display: flex; align-items: flex-start; gap: 10px;
  border-radius: 12px; padding: 12px 16px;
  border: 1px solid color-mix(in srgb, var(--danger) 34%, transparent);
  border-left: 3px solid var(--danger);
  background: color-mix(in srgb, var(--danger) 9%, transparent);
  color: var(--text); font-size: 13px;
}
.alert svg { color: var(--danger); margin-top: 1px; flex: 0 0 auto; }
.alert.ok { border-color: color-mix(in srgb, var(--ok) 34%, transparent); border-left-color: var(--ok); background: color-mix(in srgb, var(--ok) 9%, transparent); }
.alert.ok svg { color: var(--ok); }
.alert.info { border-color: color-mix(in srgb, var(--accent) 34%, transparent); border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
.alert.info svg { color: var(--accent); }
.alert.warn { border-color: color-mix(in srgb, var(--warn) 36%, transparent); border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.alert.warn svg { color: var(--warn); }

/* ---------------------------------------------------------- 楼层 / 进度条 */
.bar-row { margin: 10px 0; }
.bar-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.bar-top b { color: var(--text); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 999px; background: rgba(120, 170, 255, 0.10); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--tone), color-mix(in srgb, var(--tone) 55%, #ffffff)); }

/* ---------------------------------------------------------- 告警时间线 */
.timeline { display: flex; flex-direction: column; }
.tl-item { display: grid; grid-template-columns: 42px 54px 1fr; gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 12px; }
.tl-item:last-child { border-bottom: none; }
.tl-time { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 11.5px; }
.tl-text { color: var(--muted); line-height: 1.55; }

/* ---------------------------------------------------------- 摄像头阵列 */
.cams { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.cam {
  border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px;
  background: var(--panel); position: relative; overflow: hidden;
}
.cam::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 12px;
  opacity: 0.5; pointer-events: none;
}
.cam-top { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--dim); }
.cam-name { font-size: 12.5px; color: var(--text); margin: 8px 0 3px; }
.cam-meta { font-size: 10.5px; color: var(--dim); position: relative; z-index: 1; }

/* ---------------------------------------------------------- 模块状态 */
.modules { display: flex; flex-direction: column; gap: 8px; }
.module {
  display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--line); border-radius: 11px;
  padding: 10px 12px; background: var(--panel);
}
.module .m-ico {
  width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
  color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
}
.module .m-body { flex: 1; min-width: 0; }
.module .m-name { font-size: 12.5px; color: var(--text); }
.module .m-detail { font-size: 10.5px; color: var(--dim); margin-top: 2px; }

/* ---------------------------------------------------------- 建议卡 */
.advice {
  border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent);
  border-radius: 14px; padding: 16px 20px;
  background:
    radial-gradient(500px 200px at 90% -40%, color-mix(in srgb, var(--ok) 18%, transparent), transparent 70%),
    var(--panel);
}
.advice .a-eyebrow { font-size: 10px; letter-spacing: 2px; color: var(--ok); display: flex; gap: 6px; align-items: center; }
.advice h2 { margin: 8px 0 6px; font-size: 22px; color: var(--text); }
.advice p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.7; }
.advice .a-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ---------------------------------------------------------- 表单 / 按钮 */
.field { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.field label { font-size: 12px; color: var(--dim); }
select, .btn {
  font-family: inherit; font-size: 13px;
  border-radius: 10px; border: 1px solid var(--line2);
  background: var(--panel2); color: var(--text);
  padding: 9px 12px; cursor: pointer;
}
select:focus, .btn:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 1px; }
.btn.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-color: transparent; color: #04121f; font-weight: 650;
}
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); }

/* ---------------------------------------------------------- 扩展页 */
.slot-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.slot {
  border: 1px dashed var(--line2); border-radius: 12px; padding: 14px 16px;
  background: var(--panel); display: flex; flex-direction: column; gap: 7px;
}
.slot.filled { border-style: solid; }
.slot-name { font-size: 13.5px; color: var(--text); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.slot-hint { font-size: 11.5px; color: var(--dim); line-height: 1.6; }
.slot-meta { font-size: 10.5px; color: var(--dim); }

.code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.5px; line-height: 1.7; color: var(--muted);
  background: rgba(4, 12, 22, 0.6); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 14px; overflow: auto; white-space: pre-wrap; word-break: break-word;
}
html[data-theme="light"] .code { background: #f3f7fc; }

/* ---------------------------------------------------------- 页脚 / 提示 */
.foot {
  margin-top: auto; padding: 14px 26px 18px;
  border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; gap: 12px;
  font-size: 11px; color: var(--dim); flex-wrap: wrap;
}

.toast {
  position: fixed; right: 24px; bottom: 24px; z-index: 99;
  padding: 11px 16px; border-radius: 11px;
  border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent);
  background: color-mix(in srgb, var(--ok) 16%, var(--panel));
  color: var(--text); font-size: 12.5px;
  box-shadow: var(--shadow);
  opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  max-width: 360px;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ---------------------------------------------------------- 图表通用 */
.chart { width: 100%; display: block; }
.chart text { font-family: var(--font); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--dim); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }

.empty { color: var(--dim); font-size: 12px; padding: 18px 0; text-align: center; }

/* ---------------------------------------------------------- 响应式 */
@media (max-width: 1280px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-2 { grid-template-columns: 1fr; }
  .cams { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .slot-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; flex: none; height: auto; position: static; flex-direction: row; align-items: center; gap: 14px; overflow-x: auto; }
  .sidebar .side-label, .sidebar .side-foot, .sidebar .status-list { display: none; }
  .nav { flex-direction: row; }
  .nav-item span { display: none; }
  .hero h1 { font-size: 22px; }
  .grid-3 { grid-template-columns: 1fr; }
  .span-2 { grid-column: auto; }
}

@media print {
  .sidebar, .topbar { display: none; }
  body { background: #fff; color: #000; }
}

</style>

  <script>

</script>
  <!-- 轻量图表：纯 SVG 手写，不依赖任何 CDN，断网也能演示 -->
  <script>
/* ============================================================
   轻量图表库：纯手写 SVG，不依赖 echarts / plotly / CDN
   —— 单文件即可离线演示，答辩现场断网也不怕
   —— 颜色全部走 CSS 变量，深浅主题切换自动跟随
   —— 每个图都支持 opt.width 指定画布宽度：
       半宽面板传 560，整屏通栏传 1180，字号才不会缩成蚂蚁
   ============================================================ */
(function (global) {
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }
  function fmt(v, digits) {
    if (v === null || v === undefined || isNaN(v)) return '--';
    const d = digits === undefined ? 0 : digits;
    return Number(v).toFixed(d).replace(/\.0+$/, '');
  }
  function fmtInt(v) {
    return String(Math.round(Number(v) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  // 让刻度落在整数上：返回 { max, step }
  function niceScale(maxValue, ticks) {
    ticks = ticks || 4;
    const raw = Math.max(maxValue, 1) / ticks;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
    return { max: step * ticks, step: step };
  }

  function svgWrap(w, h, body) {
    return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h +
      '" preserveAspectRatio="xMidYMid meet" role="img" style="max-height:' + (h * 1.9).toFixed(0) + 'px">' +
      body + '</svg>';
  }

  /* --------------------------------------------------------- 折线 / 面积 */
  function line(opt) {
    const labels = opt.labels || [];
    const series = opt.series || [];
    const W = opt.width || 760;
    const h = opt.height || 230;
    const pad = { l: 40, r: 16, t: 18, b: 28 };
    const n = labels.length;
    const all = series.reduce((a, s) => a.concat(s.values || []), []);
    const scale = niceScale(Math.max.apply(null, all.concat([1])) * 1.15, 4);
    const yMax = opt.yMax || scale.max;
    const innerW = W - pad.l - pad.r;
    const innerH = h - pad.t - pad.b;
    const x = i => pad.l + (n <= 1 ? innerW / 2 : (i * innerW) / (n - 1));
    const y = v => pad.t + innerH - (Math.max(0, v) / yMax) * innerH;

    let g = '';
    for (let k = 0; k <= 4; k++) {
      const vy = pad.t + (innerH * k) / 4;
      g += '<line x1="' + pad.l + '" y1="' + vy + '" x2="' + (W - pad.r) + '" y2="' + vy + '" stroke="var(--grid)"/>';
      g += '<text x="' + (pad.l - 8) + '" y="' + (vy + 4) + '" text-anchor="end" font-size="11" fill="var(--dim)">' +
        fmtInt(yMax - (yMax * k) / 4) + '</text>';
    }

    series.forEach((s, si) => {
      const pts = (s.values || []).map((v, i) => [x(i), y(v)]);
      if (!pts.length) return;
      const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      if (s.area !== false) {
        const gid = 'grad' + si + '_' + Math.random().toString(36).slice(2, 7);
        g += '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="' + (s.color || 'var(--accent)') + '" stop-opacity="0.30"/>' +
          '<stop offset="100%" stop-color="' + (s.color || 'var(--accent)') + '" stop-opacity="0"/>' +
          '</linearGradient></defs>';
        g += '<path d="' + d + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (pad.t + innerH) +
          ' L' + pts[0][0].toFixed(1) + ' ' + (pad.t + innerH) + ' Z" fill="url(#' + gid + ')"/>';
      }
      g += '<path d="' + d + '" fill="none" stroke="' + (s.color || 'var(--accent)') +
        '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      const last = pts[pts.length - 1];
      g += '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2.8" fill="' +
        (s.color || 'var(--accent)') + '"/>';
    });

    if (opt.threshold && opt.threshold.value !== undefined) {
      const ty = y(opt.threshold.value);
      g += '<line x1="' + pad.l + '" y1="' + ty + '" x2="' + (W - pad.r) + '" y2="' + ty +
        '" stroke="var(--danger)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.85"/>';
      g += '<text x="' + (pad.l + 6) + '" y="' + (ty - 6) + '" text-anchor="start" font-size="11" fill="var(--danger)">' +
        esc(opt.threshold.label || '阈值') + '</text>';
    }

    (opt.markers || []).forEach(m => {
      if (m.index === undefined || !labels[m.index]) return;
      const mx = x(m.index), my = y(m.value);
      g += '<circle cx="' + mx + '" cy="' + my + '" r="3.6" fill="var(--warn)" stroke="var(--panel)" stroke-width="1.5"/>';
      g += '<text x="' + mx + '" y="' + (my - 11) + '" text-anchor="middle" font-size="11" fill="var(--warn)">' +
        esc(m.label) + '</text>';
    });

    const step = Math.ceil(n / 8);
    labels.forEach((lb, i) => {
      if (i % step !== 0 && i !== n - 1) return;
      g += '<text x="' + x(i) + '" y="' + (h - 9) + '" text-anchor="middle" font-size="11" fill="var(--dim)">' +
        esc(lb) + '</text>';
    });

    return svgWrap(W, h, g);
  }

  /* --------------------------------------------------------- 柱状 + 阈值线 */
  function bars(opt) {
    const items = opt.items || [];
    const W = opt.width || 760;
    const h = opt.height || 240;
    const pad = { l: 40, r: 16, t: 22, b: 34 };
    const innerW = W - pad.l - pad.r;
    const innerH = h - pad.t - pad.b;
    const scale = niceScale(Math.max.apply(null, items.map(i => i.value).concat([1])) * 1.22, 4);
    const yMax = opt.yMax || scale.max;
    const band = innerW / Math.max(items.length, 1);
    const bw = Math.min(band * 0.5, 52);
    const y = v => pad.t + innerH - (Math.max(0, v) / yMax) * innerH;

    let g = '';
    for (let k = 0; k <= 4; k++) {
      const vy = pad.t + (innerH * k) / 4;
      g += '<line x1="' + pad.l + '" y1="' + vy + '" x2="' + (W - pad.r) + '" y2="' + vy + '" stroke="var(--grid)"/>';
      g += '<text x="' + (pad.l - 8) + '" y="' + (vy + 4) + '" text-anchor="end" font-size="11" fill="var(--dim)">' +
        fmtInt(yMax - (yMax * k) / 4) + '</text>';
    }

    items.forEach((it, i) => {
      const cx = pad.l + band * i + band / 2;
      const bh = Math.max(2, pad.t + innerH - y(it.value));
      g += '<rect x="' + (cx - bw / 2) + '" y="' + y(it.value) + '" width="' + bw + '" height="' + bh +
        '" rx="4" fill="' + (it.tone || 'var(--accent)') + '" opacity="0.92"/>';
      g += '<text x="' + cx + '" y="' + (y(it.value) - 8) + '" text-anchor="middle" font-size="11.5" fill="var(--text)">' +
        fmtInt(it.value) + (it.unit || '') + '</text>';
      g += '<text x="' + cx + '" y="' + (h - 11) + '" text-anchor="middle" font-size="11" fill="var(--dim)">' +
        esc(it.label) + '</text>';
    });

    if (opt.threshold && opt.threshold.value !== undefined) {
      const ty = y(opt.threshold.value);
      g += '<line x1="' + pad.l + '" y1="' + ty + '" x2="' + (W - pad.r) + '" y2="' + ty +
        '" stroke="var(--danger)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.85"/>';
      g += '<text x="' + (W - pad.r) + '" y="' + (ty - 6) + '" text-anchor="end" font-size="11" fill="var(--danger)">' +
        esc(opt.threshold.label || '阈值') + '</text>';
    }
    return svgWrap(W, h, g);
  }

  /* --------------------------------------------------------- 环形图 */
  function donut(opt) {
    const items = (opt.items || []).filter(i => i.value > 0);
    const size = opt.size || 250;
    const cx = size / 2, cy = size / 2;
    const R = size / 2 - 8;
    const r = R * 0.64;
    const total = items.reduce((a, b) => a + b.value, 0) || 1;
    const colors = ['var(--accent)', 'var(--ok)', 'var(--warn)', 'var(--accent2)', 'var(--danger)'];
    let ang = -Math.PI / 2;
    let g = '';

    const arc = (a0, a1, ro, ri) => {
      const p = (a, rad) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
      const large = a1 - a0 > Math.PI ? 1 : 0;
      const s1 = p(a0, ro), e1 = p(a1, ro), s2 = p(a1, ri), e2 = p(a0, ri);
      return 'M' + s1[0].toFixed(2) + ' ' + s1[1].toFixed(2) +
        ' A' + ro + ' ' + ro + ' 0 ' + large + ' 1 ' + e1[0].toFixed(2) + ' ' + e1[1].toFixed(2) +
        ' L' + s2[0].toFixed(2) + ' ' + s2[1].toFixed(2) +
        ' A' + ri + ' ' + ri + ' 0 ' + large + ' 0 ' + e2[0].toFixed(2) + ' ' + e2[1].toFixed(2) + ' Z';
    };

    items.forEach((it, i) => {
      const a0 = ang, a1 = ang + (it.value / total) * Math.PI * 2;
      ang = a1;
      const color = it.color || colors[i % colors.length];
      const pad = 0.012;
      g += '<path d="' + arc(a0 + pad, Math.max(a0 + pad, a1 - pad), R, r) + '" fill="' + color + '" opacity="0.95"/>';
      const mid = (a0 + a1) / 2;
      const pct = (it.value / total) * 100;
      if (pct >= 6) {
        const lx = cx + ((R + r) / 2) * Math.cos(mid);
        const ly = cy + ((R + r) / 2) * Math.sin(mid);
        g += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 4).toFixed(1) + '" text-anchor="middle" font-size="12" ' +
          'fill="#fff" font-weight="600">' + pct.toFixed(1) + '%</text>';
      }
    });

    g += '<text x="' + cx + '" y="' + (cy - 3) + '" text-anchor="middle" font-size="21" font-weight="700" fill="var(--text)">' +
      esc(opt.centerValue !== undefined ? opt.centerValue : fmtInt(total)) + '</text>';
    g += '<text x="' + cx + '" y="' + (cy + 16) + '" text-anchor="middle" font-size="11" fill="var(--dim)">' +
      esc(opt.centerLabel || '总计') + '</text>';

    const legend = items.map((it, i) =>
      '<span><i style="background:' + (it.color || colors[i % colors.length]) + '"></i>' + esc(it.label) + '</span>').join('');

    return '<div style="display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap">' +
      '<svg viewBox="0 0 ' + size + ' ' + size + '" style="width:' + size + 'px;max-width:100%;height:auto" role="img">' +
      g + '</svg><div class="legend" style="flex-direction:column;gap:9px">' + legend + '</div></div>';
  }

  /* --------------------------------------------------------- 雷达图 */
  function radar(opt) {
    const axes = opt.axes || [];
    const n = Math.max(axes.length, 3);
    const size = opt.size || 300;
    const cx = size / 2, cy = size / 2 + 2;
    const R = size / 2 - 46;
    const max = opt.max || 100;
    const pt = (i, v) => {
      const a = -Math.PI / 2 + (i * Math.PI * 2) / n;
      const rr = (v / max) * R;
      return [cx + rr * Math.cos(a), cy + rr * Math.sin(a)];
    };
    let g = '';

    [0.25, 0.5, 0.75, 1].forEach(k => {
      const pts = [];
      for (let i = 0; i < n; i++) pts.push(pt(i, max * k));
      g += '<polygon points="' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') +
        '" fill="none" stroke="var(--grid)"/>';
    });
    for (let i = 0; i < n; i++) {
      const p = pt(i, max);
      g += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) +
        '" stroke="var(--grid)"/>';
    }

    if (opt.baseline) {
      const pts = opt.baseline.map((v, i) => pt(i, v));
      g += '<polygon points="' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') +
        '" fill="none" stroke="var(--dim)" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.7"/>';
    }

    const poly = axes.map((a, i) => pt(i, a.value));
    g += '<polygon points="' + poly.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') +
      '" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>';
    poly.forEach(p => { g += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="var(--accent)"/>'; });

    axes.forEach((a, i) => {
      const ang = -Math.PI / 2 + (i * Math.PI * 2) / n;
      const lx = cx + (R + 24) * Math.cos(ang);
      const ly = cy + (R + 24) * Math.sin(ang);
      const anchor = Math.abs(Math.cos(ang)) < 0.25 ? 'middle' : (Math.cos(ang) > 0 ? 'start' : 'end');
      g += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 3).toFixed(1) + '" text-anchor="' + anchor +
        '" font-size="11" fill="var(--muted)">' + esc(a.label) + '</text>';
      g += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 17).toFixed(1) + '" text-anchor="' + anchor +
        '" font-size="10" fill="var(--dim)">' + fmtInt(a.value) + '</text>';
    });

    return '<svg class="chart" viewBox="0 0 ' + size + ' ' + size + '" style="max-height:330px" ' +
      'preserveAspectRatio="xMidYMid meet" role="img">' + g + '</svg>';
  }

  /* --------------------------------------------------------- 堆叠面积图 */
  function stacked(opt) {
    const labels = opt.labels || [];
    const series = opt.series || [];
    const W = opt.width || 1180;
    const h = opt.height || 240;
    const pad = { l: 40, r: 16, t: 16, b: 28 };
    const n = labels.length;
    const innerW = W - pad.l - pad.r;
    const innerH = h - pad.t - pad.b;
    const totals = labels.map((_, i) => series.reduce((a, s) => a + (s.values[i] || 0), 0));
    const scale = niceScale(Math.max.apply(null, totals.concat([1])), 3);
    const yMax = scale.max;
    const x = i => pad.l + (n <= 1 ? innerW / 2 : (i * innerW) / (n - 1));
    const y = v => pad.t + innerH - (v / yMax) * innerH;
    let g = '';

    for (let k = 0; k <= 3; k++) {
      const vy = pad.t + (innerH * k) / 3;
      g += '<line x1="' + pad.l + '" y1="' + vy + '" x2="' + (W - pad.r) + '" y2="' + vy + '" stroke="var(--grid)"/>';
      g += '<text x="' + (pad.l - 8) + '" y="' + (vy + 4) + '" text-anchor="end" font-size="11" fill="var(--dim)">' +
        fmtInt(yMax - (yMax * k) / 3) + '</text>';
    }

    const base = labels.map(() => 0);
    series.forEach((s, si) => {
      const color = s.color || ['var(--accent)', 'var(--ok)', 'var(--warn)', 'var(--accent2)'][si % 4];
      const top = labels.map((_, i) => base[i] + (s.values[i] || 0));
      const up = labels.map((_, i) => x(i) + ',' + y(top[i]).toFixed(1)).join(' ');
      const down = labels.map((_, i) => x(n - 1 - i) + ',' + y(base[n - 1 - i]).toFixed(1)).join(' ');
      g += '<polygon points="' + up + ' ' + down + '" fill="' + color + '" opacity="0.5"/>';
      for (let i = 0; i < n; i++) base[i] = top[i];
    });

    const step = Math.ceil(n / 9);
    labels.forEach((lb, i) => {
      if (i % step !== 0 && i !== n - 1) return;
      g += '<text x="' + x(i) + '" y="' + (h - 9) + '" text-anchor="middle" font-size="11" fill="var(--dim)">' +
        esc(lb) + '</text>';
    });

    return svgWrap(W, h, g);
  }

  /* --------------------------------------------------------- 柱 + 折线组合 */
  function combo(opt) {
    const labels = opt.labels || [];
    const W = opt.width || 760;
    const barsS = opt.bars || { values: [] };
    const lineS = opt.line || { values: [] };
    const h = opt.height || 230;
    const pad = { l: 44, r: 44, t: 20, b: 30 };
    const innerW = W - pad.l - pad.r;
    const innerH = h - pad.t - pad.b;
    const band = innerW / Math.max(labels.length, 1);
    const bw = Math.min(band * 0.52, 40);
    const s1 = niceScale(Math.max.apply(null, barsS.values.concat([1])) * 1.15, 3);
    const s2 = niceScale(Math.max.apply(null, lineS.values.concat([1])) * 1.15, 3);
    const y = v => pad.t + innerH - (v / s1.max) * innerH;
    const y2 = v => pad.t + innerH - (v / s2.max) * innerH;
    let g = '';

    for (let k = 0; k <= 3; k++) {
      const vy = pad.t + (innerH * k) / 3;
      g += '<line x1="' + pad.l + '" y1="' + vy + '" x2="' + (W - pad.r) + '" y2="' + vy + '" stroke="var(--grid)"/>';
      g += '<text x="' + (pad.l - 8) + '" y="' + (vy + 4) + '" text-anchor="end" font-size="11" fill="var(--dim)">' +
        fmtInt(s1.max - (s1.max * k) / 3) + '</text>';
      g += '<text x="' + (W - pad.r + 8) + '" y="' + (vy + 4) + '" font-size="11" fill="var(--dim)">' +
        fmtInt(s2.max - (s2.max * k) / 3) + '</text>';
    }

    labels.forEach((lb, i) => {
      const cx = pad.l + band * i + band / 2;
      const v = barsS.values[i] || 0;
      g += '<rect x="' + (cx - bw / 2) + '" y="' + y(v) + '" width="' + bw + '" height="' +
        Math.max(2, pad.t + innerH - y(v)) + '" rx="3" fill="var(--accent)" opacity="0.85"/>';
      g += '<text x="' + cx + '" y="' + (h - 10) + '" text-anchor="middle" font-size="10.5" fill="var(--dim)">' + esc(lb) + '</text>';
    });

    const pts = labels.map((_, i) => [pad.l + band * i + band / 2, y2(lineS.values[i] || 0)]);
    g += '<path d="' + pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ') +
      '" fill="none" stroke="var(--ok)" stroke-width="2" stroke-linejoin="round"/>';
    pts.forEach(p => { g += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.8" fill="var(--ok)"/>'; });

    return svgWrap(W, h, g);
  }

  /* --------------------------------------------------------- 进度条 */
  function progress(opt) {
    const pct = Math.max(0, Math.min(100, opt.value || 0));
    const tone = opt.tone || 'var(--accent)';
    return '<div class="bar-row"><div class="bar-top"><span>' + esc(opt.label || '') + '</span><b>' +
      fmt(pct, 1) + '%</b></div><div class="bar"><i style="--tone:' + tone + ';width:' + pct + '%"></i></div></div>';
  }

  global.Charts = { line, bars, donut, radar, stacked, combo, progress, fmt, fmtInt, esc, niceScale };
})(window);

</script>
  <!-- 平台内核：模块注册 / 数据源注册 / 路由 / 通用渲染器 -->
  <script>
/* ============================================================
   平台内核 Platform
   ------------------------------------------------------------
   三件事：
   1) 数据：优先 fetch data/*.json（便于合作方直接改 JSON），
      失败则回落到 assets/js/data.js 内联数据（file:// 直接双击打开）
   2) 注册：registerPage / registerModule / registerDataSource，
      三方各自开发自己的板块，只需要往平台里注册，不用改别人的代码
   3) 渲染：统一 UI 组件（hero / kpi / panel / table / badge …）
   ============================================================ */
(function (global) {
  const DATA_FILES = ['manifest', 'overview', 'queue', 'floors', 'nutrition', 'extensions'];

  const Platform = {
    version: '1.0.0',
    data: {},
    pages: [],
    modules: [],
    dataSources: {},
    ui: {},
    _ready: []
  };

  /* --------------------------------------------------------- 数据加载 */
  Platform.load = async function () {
    const inline = global.__PLATFORM_DATA__ || {};
    for (const name of DATA_FILES) {
      let payload = null;
      // 只有 http(s) 下才去 fetch 外部 JSON；file:// 与 srcdoc 直接用内联数据
      const canFetch = location.protocol === 'http:' || location.protocol === 'https:';
      if (canFetch) {
        try {
          const res = await fetch('data/' + name + '.json', { cache: 'no-store' });
          if (res.ok) payload = await res.json();
        } catch (e) {
          // http 下取不到就退回内联数据
        }
      }
      if (!payload) payload = inline[name] || null;
      Platform.data[name] = payload;
    }
    Platform.data._inline = JSON.stringify(inline).length > 2;
    return Platform.data;
  };

  /* --------------------------------------------------------- 注册接口 */
  // 新增一个导航页：{ id, label, icon, eyebrow, render(root, ctx) }
  Platform.registerPage = function (def) {
    if (!def || !def.id) throw new Error('registerPage 需要 id');
    Platform.pages.push(def);
    return def;
  };

  // 声明一个业务模块（显示在总览的「模块接入状态」里）
  Platform.registerModule = function (def) {
    Platform.modules.push(def);
    return def;
  };

  // 注册实时数据源：fn() 返回与 JSON 同构的对象，覆盖 mock 数据
  Platform.registerDataSource = function (key, fn) {
    Platform.dataSources[key] = fn;
    return fn;
  };

  // 应用已注册的实时数据源（页面渲染前调用一次）
  Platform.applyDataSources = async function () {
    for (const key of Object.keys(Platform.dataSources)) {
      try {
        const out = await Platform.dataSources[key]();
        if (out) Platform.data[key] = out;
      } catch (e) {
        console.warn('[platform] 数据源失败：' + key, e);
      }
    }
  };

  Platform.getPage = function (id) {
    return Platform.pages.find(p => p.id === id) || null;
  };

  /* --------------------------------------------------------- 小工具 */
  const html = (s) => String(s === null || s === undefined ? '' : s);

  Platform.esc = function (s) {
    return html(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  };

  Platform.num = function (v) {
    const n = Number(v);
    if (!isFinite(n)) return html(v);
    return n.toLocaleString('zh-CN');
  };

  Platform.toneOf = function (tone) {
    const map = { ok: 'var(--ok)', warn: 'var(--warn)', danger: 'var(--danger)', accent: 'var(--accent)', flat: 'var(--dim)' };
    return map[tone] || 'var(--accent)';
  };

  Platform.badgeClass = function (tone) {
    const map = { ok: 'tag-ok', warn: 'tag-warn', danger: 'tag-danger', accent: 'tag-info', info: 'tag-info' };
    return map[tone] || 'tag-muted';
  };

  /* --------------------------------------------------------- UI 组件 */
  const ui = Platform.ui;

  // 顶部横幅
  ui.hero = function (hero) {
    if (!hero) return '';
    const stats = (hero.stats || []).map(s =>
      '<div class="hero-stat"><div class="k">' + Platform.esc(s.label) + '</div>' +
      '<div class="v">' + Platform.esc(s.value) + '</div>' +
      '<div class="s">' + Platform.esc(s.sub) + '</div></div>').join('');
    return '<section class="hero"><div class="hero-main">' +
      '<span class="hero-eyebrow">' + Platform.esc(hero.eyebrow) + '</span>' +
      '<h1>' + Platform.esc(hero.title) + '</h1>' +
      '<p>' + Platform.esc(hero.subtitle) + '</p>' +
      '</div><div class="hero-stats">' + stats + '</div></section>';
  };

  // 指标卡
  ui.kpi = function (k) {
    const tone = Platform.toneOf(k.tone);
    const trendIcon = k.trend === 'up' ? 'trend' : k.trend === 'down' ? 'trend' : 'info';
    return '<div class="kpi" style="--tone:' + tone + '">' +
      '<div class="kpi-head"><span class="kpi-ico">' + icon(k.icon || 'info', 14) + '</span>' +
      '<span>' + Platform.esc(k.label) + '</span></div>' +
      '<div class="kpi-value"><b>' + Platform.esc(k.value) + '</b>' +
      (k.unit ? '<span>' + Platform.esc(k.unit) + '</span>' : '') + '</div>' +
      '<div class="kpi-foot">' +
      (k.delta ? '<span class="chip">' + icon(trendIcon, 11) + Platform.esc(k.delta) + '</span>' : '<span></span>') +
      '<span class="kpi-src">' + Platform.esc(k.source || '') + '</span>' +
      '</div></div>';
  };

  ui.kpis = function (list) {
    return '<div class="kpis">' + (list || []).map(ui.kpi).join('') + '</div>';
  };

  // 面板
  ui.panel = function (opt) {
    const head = '<div class="panel-head"><div>' +
      '<div class="panel-title">' + (opt.icon ? icon(opt.icon, 15) : '') + Platform.esc(opt.title || '') + '</div>' +
      (opt.sub ? '<div class="panel-sub">' + Platform.esc(opt.sub) + '</div>' : '') +
      '</div>' + (opt.tag ? '<div class="panel-tag">' + Platform.esc(opt.tag) + '</div>' : '') + '</div>';
    return '<section class="panel ' + (opt.cls || '') + '">' + head + (opt.body || '') + '</section>';
  };

  // 表格：headers 数组，rows 二维数组（单元格可含 HTML，需自行转义）
  ui.table = function (headers, rows, opt) {
    opt = opt || {};
    const th = headers.map((h, i) => '<th class="' + (opt.numFrom && i >= opt.numFrom ? 'num' : '') + '">' + Platform.esc(h) + '</th>').join('');
    const tr = rows.map(r => '<tr>' + r.map((c, i) =>
      '<td class="' + (opt.numFrom && i >= opt.numFrom ? 'num' : '') + '">' + (opt.raw ? c : Platform.esc(c)) + '</td>').join('') + '</tr>').join('');
    return '<table class="table"><thead><tr>' + th + '</tr></thead><tbody>' + tr + '</tbody></table>';
  };

  ui.badge = function (text, tone) {
    return '<span class="badge ' + Platform.badgeClass(tone) + '">' + Platform.esc(text) + '</span>';
  };

  ui.alert = function (text, opt) {
    opt = opt || {};
    const tone = opt.tone || (opt.ok ? 'ok' : 'danger');
    const ico = tone === 'ok' ? 'check' : tone === 'info' ? 'info' : 'alert';
    return '<div class="alert ' + tone + '">' + icon(ico, 16) +
      '<div>' + Platform.esc(text) + '</div></div>';
  };

  ui.barRow = function (label, pct, tone) {
    return Charts.progress({ label: label, value: pct, tone: Platform.toneOf(tone) });
  };

  const LEVEL_LABEL = { info: '提示', warn: '警告', warning: '警告', error: '严重', critical: '严重', ok: '正常' };

  ui.timeline = function (items) {
    const rows = (items || []).map(it => {
      const raw = String(it.level || 'info').toLowerCase();
      const emo = (raw === 'warn' || raw === 'warning' || raw === 'error' || raw === 'critical' || it.level === '警告' || it.level === '严重');
      const tone = emo ? 'danger' : 'accent';
      const text = LEVEL_LABEL[raw] || it.level;
      return '<div class="tl-item"><span class="tl-time">' + Platform.esc(it.time) + '</span>' +
        ui.badge(text, tone) +
        '<span class="tl-text">' + Platform.esc(it.text) + '</span></div>';
    }).join('');
    return '<div class="timeline">' + rows + '</div>';
  };

  ui.moduleRow = function (m) {
    const tone = m.status === 'running' ? 'ok' : m.status === 'mock' ? 'accent' : 'warn';
    const label = m.status === 'running' ? '运行中' : m.status === 'mock' ? '模拟数据' : '待接入';
    return '<div class="module"><span class="m-ico">' + icon(m.icon || 'plug', 14) + '</span>' +
      '<div class="m-body"><div class="m-name">' + Platform.esc(m.name) + '</div>' +
      '<div class="m-detail">' + Platform.esc(m.owner || '') + ' · ' + Platform.esc(m.detail || '') + '</div></div>' +
      ui.badge(label, tone) + '</div>';
  };

  ui.cameras = function (list) {
    const cards = (list || []).map(c => {
      const online = c.status === 'online' || c.status === '在线';
      return '<div class="cam"><div class="cam-top"><span>' + Platform.esc(c.id) + '</span>' +
        ui.badge(online ? '在线' : '离线', online ? 'ok' : 'danger') + '</div>' +
        '<div class="cam-name">' + Platform.esc(c.name) + '</div>' +
        '<div class="cam-meta">' + Platform.esc(c.floor) + ' · ' + Platform.esc(c.resolution || '') +
        (c.fps ? ' · ' + c.fps + ' fps' : '') + '</div></div>';
    }).join('');
    return '<div class="cams">' + cards + '</div>';
  };

  ui.legend = function (items) {
    const parts = (items || []).map(i => '<span><i style="background:' + (i.color || Platform.toneOf(i.tone)) + '"></i>' +
      Platform.esc(i.name || i.label) + '</span>').join('');
    return '<div class="legend">' + parts + '</div>';
  };

  /* --------------------------------------------------------- 路由 */
  Platform.currentId = null;
  Platform.onNavigate = null;   // 由 app.js 注入

  // 纯内存路由：不写 location.hash / history，避免在 srcdoc 等受限容器里被浏览器拦截
  Platform.navigate = function (id, push) {
    if (!id || !Platform.getPage(id)) return;
    Platform.currentId = id;
    if (Platform.onNavigate) Platform.onNavigate(id);
  };

  /* --------------------------------------------------------- 启动 */
  Platform.boot = async function (opts) {
    await Platform.load();
    await Platform.applyDataSources();
    // 通用模块页（data/extensions.json 声明即可，零代码）
    if (typeof Platform.buildGenericPages === 'function') Platform.buildGenericPages();
    const hash = (location.hash || '').replace(/^#\/?/, '');
    const nav = (Platform.data.manifest && Platform.data.manifest.nav) || [];
    const first = nav.length ? nav[0].id : (Platform.pages[0] && Platform.pages[0].id);
    // 若以 #/xxx 打开则直接进该页，其余情况进第一页；全过程不碰浏览历史
    if (hash && Platform.getPage(hash)) {
      Platform.navigate(hash, false);
    } else {
      Platform.navigate(first, false);
    }

    // 主题（localStorage 在沙箱里可能不可用，取不到就用默认深色）
    try {
      const saved = global.localStorage && global.localStorage.getItem('canteen-theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (e) { /* 忽略：受限容器里没有存储权限 */ }

    Platform._ready.forEach(fn => fn(Platform));
    if (opts && opts.onReady) opts.onReady(Platform);
  };

  Platform.ready = function (fn) { Platform._ready.push(fn); };

  global.Platform = Platform;
})(window);

</script>
  <!-- 五个页面 -->
  <script>
/* ============================================================
   五个页面
   ------------------------------------------------------------
   每个页面都是「一个 render 函数 + 可选 mount（绑定交互）」，
   想加新板块的人只要照抄一个 registerPage，不用碰别人代码。
   ============================================================ */
(function (global) {
  const P = global.Platform;
  const ui = P.ui;
  const C = global.Charts;
  const esc = P.esc;

  const PALETTE = ['var(--accent)', 'var(--ok)', 'var(--warn)', 'var(--accent2)', 'var(--danger)', '#a78bfa'];

  /* ======================================================= 1. 系统总览 */
  P.registerPage({
    id: 'overview',
    label: '系统总览',
    icon: 'grid',
    render: function (ctx) {
      const d = ctx.data.overview || {};
      const hourly = d.hourly || { categories: [], values: [] };
      const peak = hourly.values.indexOf(Math.max.apply(null, hourly.values || [0]));

      const hero = ui.hero(d.hero);
      const kpis = ui.kpis(d.kpis);

      const hourlyPanel = ui.panel({
        title: '今日就餐人次分布', sub: '按小时统计的进出场人流，用于预判拥堵时段', tag: 'TODAY / HOURLY', icon: 'trend',
        body: C.line({
          labels: hourly.categories, height: 250, width: 620,
          series: [{ name: '就餐人次', values: hourly.values, color: 'var(--accent)' }],
          markers: peak >= 0 ? [{ index: peak, value: hourly.values[peak], label: '峰值 ' + hourly.values[peak] }] : []
        }) + ui.legend([{ name: '就餐人次', color: 'var(--accent)' }, { name: '午高峰', color: 'var(--warn)' }])
      });

      const modulesPanel = ui.panel({
        title: '模块接入状态', sub: '三个业务板块与基础服务的连通情况', tag: 'MODULES', icon: 'plug',
        body: '<div class="modules">' + (d.modules || []).map(ui.moduleRow).join('') + '</div>'
      });

      const fl = (ctx.data.floors && ctx.data.floors.floors) || [];
      const seatTotal = fl.reduce((a, b) => a + b.seats, 0);
      const seatUsed = fl.reduce((a, b) => a + b.occupied, 0);

      const floorBars = (d.floors || []).map(f => {
        const tone = f.usage >= 80 ? 'danger' : f.usage >= 65 ? 'warn' : 'accent';
        return ui.barRow(f.name + ' · 座位占用', f.usage, tone);
      }).join('');

      const floorsPanel = ui.panel({
        title: '楼层承载', sub: '实时座位占用', tag: 'FLOORS', icon: 'layers',
        body: floorBars +
          '<div class="panel-sub" style="margin-top:10px">座位合计 ' + C.fmtInt(seatTotal) + ' · 在座 ' + C.fmtInt(seatUsed) +
          ' · 空余 ' + C.fmtInt(seatTotal - seatUsed) + '<br>占用超过 80% 时建议分流，等待时间会明显上升</div>'
      });

      const alertsPanel = ui.panel({
        title: '实时告警', sub: '按时间倒序，红色为需要立即处理', tag: 'ALERTS', icon: 'bell',
        body: ui.timeline(d.alerts)
      });

      const resPanel = ui.panel({
        title: '系统资源', sub: '采集自本地数据中台', tag: 'SYSTEM', icon: 'cpu',
        body: (d.resources || []).map(r =>
          ui.barRow(r.name, r.value, r.value >= 95 ? 'ok' : r.value >= 65 ? 'warn' : 'danger')).join('')
      });

      const notice = ui.alert(
        '集成说明：三个板块目前均由 data/*.json 提供演示数据。合作方接入真实硬件 / 算法后，' +
        '只需把结果写进对应 JSON（或注册一个数据源函数），本页所有指标、图表、告警会自动更新。',
        { tone: 'ok' });

      return hero + kpis +
        '<div class="grid-2">' + hourlyPanel + modulesPanel + '</div>' +
        '<div class="grid-3">' + floorsPanel + alertsPanel + resPanel + '</div>' +
        notice;
    }
  });

  /* ======================================================= 2. 排队拥堵监控 */
  P.registerPage({
    id: 'queue',
    label: '排队拥堵监控',
    icon: 'users',
    render: function (ctx) {
      const d = ctx.data.queue || {};
      const threshold = d.threshold || 20;

      const barsPanel = ui.panel({
        title: '各窗口排队人数', sub: '柱高为当前排队人数，红色虚线为拥挤阈值', tag: 'WINDOW / NOW', icon: 'trend',
        body: C.bars({
          width: 620,
          items: (d.windows || []).map(w => ({
            label: w.name.split('·')[0].trim(),
            value: w.people,
            tone: w.level === '拥挤' ? 'var(--danger)' : w.level === '一般' ? 'var(--warn)' : 'var(--ok)'
          })),
          threshold: { value: threshold, label: '拥挤阈值 ' + threshold + ' 人' },
          height: 300
        })
      });

      const rows = (d.windows || []).map(w => {
        const tone = w.level === '拥挤' ? 'danger' : w.level === '一般' ? 'warn' : 'ok';
        return [w.name, w.floor, w.people + ' 人', w.wait, ui.badge(w.level, tone)];
      });
      const tablePanel = ui.panel({
        title: '窗口实时明细', sub: '数据来自 data/queue.json 的最新快照', tag: 'SNAPSHOT', icon: 'database',
        body: ui.table(['窗口', '楼层', '排队', '预计等待', '拥挤度'], rows, { numFrom: 2, raw: true })
      });

      const trend = d.trend || { categories: [], series: [] };
      const trendPanel = ui.panel({
        title: '近 3 小时排队趋势', sub: '每 10 分钟一个采样点，可看出拥堵是否回落', tag: 'TREND / 3H', icon: 'trend',
        body: C.line({
          labels: trend.categories, height: 230, width: 1180,
          series: trend.series.map((s, i) => ({ name: s.name, values: s.values, color: PALETTE[i % PALETTE.length], area: false })),
          threshold: { value: threshold, label: '阈值 ' + threshold }
        }) + ui.legend(trend.series.map((s, i) => ({ name: s.name, color: PALETTE[i % PALETTE.length] })))
      });

      const camsPanel = ui.panel({
        title: '摄像头阵列', sub: '在线设备实时预览占位，第二阶段由 YOLO 服务推送检测流', tag: 'CAMERA GRID', icon: 'camera',
        body: ui.cameras(d.cameras)
      });

      const notice = ui.alert(
        '接口说明：本页只读 data/queue.json。CV 组把「窗口 → 排队人数」写进这个文件（或用 registerDataSource("queue", fn) 推送），' +
        '柱状图、明细表、告警条会同时刷新，前端不需要改一行代码。', { tone: 'info' });

      const toolbar = '<div class="field" style="align-items:center">' +
        '<button class="btn ghost" data-action="refresh">' + icon('refresh', 14) + ' 刷新监控数据</button>' +
        '<span class="kpi-src">最近一次快照：' + esc((d.hero && d.hero.stats && d.hero.stats[2] ? d.hero.stats[2].value : '--')) + '</span></div>';

      return ui.hero(d.hero) +
        (d.alert ? ui.alert(d.alert) : '') +
        ui.kpis(d.kpis) +
        '<div class="grid-2">' + barsPanel + tablePanel + '</div>' +
        trendPanel + camsPanel + notice + toolbar;
    },
    mount: function (root, ctx) {
      const btn = root.querySelector('[data-action="refresh"]');
      if (btn) btn.addEventListener('click', () => {
        ctx.toast('演示模式：真实接入后这里会重新拉取摄像头检测结果');
        ctx.rerender();
      });
    }
  });

  /* ======================================================= 3. 楼层分流建议 */
  P.registerPage({
    id: 'floors',
    label: '楼层分流建议',
    icon: 'layers',
    render: function (ctx) {
      const d = ctx.data.floors || {};
      const adv = d.advice || {};

      const advice = '<section class="advice">' +
        '<div class="a-eyebrow">' + icon('target', 12) + ' AI 分流建议 · 实时计算</div>' +
        '<h2>' + esc(adv.title || '') + '</h2>' +
        '<p>' + esc(adv.reason || '') + '</p>' +
        '<div class="a-badges">' + (adv.badges || []).map(b => ui.badge(b, 'ok')).join('') + '</div>' +
        '</section>';

      const share = d.share || [];
      const donutPanel = ui.panel({
        title: '各楼层就餐人数占比', sub: '按最后一次楼层快照统计', tag: 'SHARE', icon: 'pie',
        body: C.donut({
          items: share.map((s, i) => ({ label: s.name, value: s.value, color: PALETTE[i % PALETTE.length] })),
          centerValue: C.fmtInt(share.reduce((a, b) => a + b.value, 0)),
          centerLabel: '在餐总人数', size: 250
        })
      });

      const rows = (d.floors || []).map(f => [
        f.name, f.seats + ' 座', f.occupied, ui.badge(f.usage.toFixed(1) + '%', f.usage >= 80 ? 'danger' : f.usage >= 65 ? 'warn' : 'ok'), f.wait
      ]);
      const statePanel = ui.panel({
        title: '楼层实时状态', sub: '座位使用率 = 在座人数 ÷ 座位数', tag: 'FLOOR STATUS', icon: 'seat',
        body: ui.table(['楼层', '座位数', '在座', '使用率', '等待'], rows, { numFrom: 1, raw: true }) +
          '<div style="margin-top:8px">' + (d.floors || []).map(f =>
            ui.barRow(f.name, f.usage, f.usage >= 80 ? 'danger' : f.usage >= 65 ? 'warn' : 'accent')).join('') + '</div>'
      });

      const flow = d.flow || { categories: [], series: [] };
      const flowPanel = ui.panel({
        title: '三层人流分布（今日）', sub: '堆叠面积图展示各楼层分时就餐人数', tag: 'FLOW / TODAY', icon: 'layers',
        body: C.stacked({
          labels: flow.categories, height: 230, width: 1180,
          series: flow.series.map((s, i) => ({ name: s.name, values: s.values, color: PALETTE[i % PALETTE.length] }))
        }) + ui.legend(flow.series.map((s, i) => ({ name: s.name, color: PALETTE[i % PALETTE.length] })))
      });

      const notice = ui.alert(
        '接口说明：硬件组把多路摄像头的窗口级结果汇总成「楼层 → 在座 / 座位」写进 data/floors.json，' +
        '建议卡、环形图、状态表会按同一份数据重算，推荐算法也可以换成你们自己的实现。', { tone: 'info' });

      return ui.hero(d.hero) + advice + ui.kpis(d.kpis) +
        '<div class="grid-2">' + donutPanel + statePanel + '</div>' +
        flowPanel + notice;
    }
  });

  /* ======================================================= 4. 营养健康分析 */
  P.registerPage({
    id: 'nutrition',
    label: '营养健康分析',
    icon: 'leaf',
    render: function (ctx) {
      const all = (ctx.data.nutrition && ctx.data.nutrition.students) || [];
      if (!all.length) return ui.hero(null) + '<div class="empty">暂无营养数据</div>';

      const idx = Math.min(P.state.studentIndex || 0, all.length - 1);
      const s = all[idx];

      const hero = ui.hero({
        eyebrow: 'CONTROL CENTER / NUTRITION',
        title: '营养健康分析',
        subtitle: '读取学生餐卡点餐记录，生成六维营养雷达图与家长周报',
        stats: [
          { label: 'STUDENT', value: s.name, sub: s.class_name },
          { label: 'WEEK', value: s.week, sub: '统计周期' },
          { label: 'SCORE', value: s.kpis[3] ? s.kpis[3].value : '--', sub: '综合营养得分' }
        ]
      });

      const picker = '<div class="field">' +
        '<label for="stu">' + icon('user', 13) + ' 选择学生（按学号查询餐卡记录）</label>' +
        '<select id="stu">' + all.map((x, i) =>
          '<option value="' + i + '"' + (i === idx ? ' selected' : '') + '>' + esc(x.label) + '</option>').join('') +
        '</select>' +
        '<span class="kpi-src">卡号 ' + esc(s.card_no) + ' · 学号 ' + esc(s.id) + '</span></div>';

      const radar = s.radar || { axes: [], actual: [] };
      const radarPanel = ui.panel({
        title: '本周营养摄入雷达图', sub: '虚线为推荐标准，实线为本周实际摄入', tag: 'RADAR / WEEK', icon: 'target',
        body: C.radar({
          axes: radar.axes.map((name, i) => ({ label: name, value: radar.actual[i] })),
          baseline: radar.standard || radar.axes.map(() => 100),
          max: 100, size: 300
        })
      });

      const t = s.trend || { categories: [], kcal: [], protein: [] };
      const trendPanel = ui.panel({
        title: '每日热量与蛋白质趋势', sub: '柱为热量，线为蛋白质（已放大 10 倍便于同图比较）', tag: 'TREND / 8D', icon: 'trend',
        body: C.combo({ labels: t.categories, bars: { values: t.kcal }, line: { values: t.protein }, height: 230, width: 620 }) +
          ui.legend([{ name: '热量 kcal', color: 'var(--accent)' }, { name: '蛋白质 ×10 g', color: 'var(--ok)' }])
      });

      const meals = s.meals || [];
      const mealPanel = ui.panel({
        title: '餐次热量构成', sub: '早 / 中 / 晚三餐占比', tag: 'MEAL MIX', icon: 'pie',
        body: C.donut({
          items: meals.map((m, i) => ({ label: m.name, value: m.value, color: PALETTE[i % PALETTE.length] })),
          centerValue: meals.length + ' 餐', centerLabel: '餐次构成', size: 210
        })
      });

      const advicePanel = ui.panel({
        title: '营养师建议', sub: '按六维得分自动生成', tag: 'ADVICE', icon: 'shield',
        body: (s.advice || []).map(a =>
          '<div style="padding:8px 0;border-bottom:1px dashed var(--line)">' +
          '<div style="font-size:13px;color:var(--warn)">' + esc(a.name) + ' · ' + C.fmt(a.score, 1) + ' 分</div>' +
          '<div style="font-size:12px;color:var(--muted);margin-top:3px">' + esc(a.tip) + '</div></div>').join('')
      });

      const recPanel = ui.panel({
        title: '最近点餐记录', sub: '来自餐卡消费流水', tag: 'RECORDS', icon: 'database',
        body: ui.table(['时间', '餐次', '菜品', '热量', '金额'],
          (s.records || []).map(r => [r.time, r.meal, r.dish, r.kcal + ' kcal', r.amount]), { numFrom: 3 })
      });

      const pushPanel = ui.panel({
        title: '家长周报推送', sub: '推送到微信服务号（当前为模拟发送）', tag: 'PUSH', icon: 'send',
        body: '<div class="field">' +
          '<button class="btn primary" data-action="push">' + icon('send', 14) + ' 生成并推送家长微信</button>' +
          '<span class="kpi-src">将生成《' + esc(s.class_name) + ' ' + esc(s.name) + ' · ' + esc(s.week) + ' 营养周报》</span></div>' +
          '<div id="push-result"></div>' +
          '<div style="margin-top:10px;font-size:11.5px;color:var(--dim)">历史推送：' +
          ((s.pushes || []).map(p => esc(p.day) + ' · ' + esc(p.channel) + ' · ' + esc(p.status)).join('　|　') || '暂无') +
          '</div>'
      });

      const notice = ui.alert(
        '接口说明：数据组把每人每日的餐卡明细写进 data/nutrition.json，前端负责聚合与可视化。' +
        '真实推送由后端的微信服务号 / 企业机器人完成，页面只保留按钮与结果位。', { tone: 'info' });

      return hero + picker + ui.kpis(s.kpis) +
        '<div class="grid-2">' + radarPanel + trendPanel + '</div>' +
        '<div class="grid-3">' + mealPanel + advicePanel + pushPanel + '</div>' +
        recPanel + notice;
    },
    mount: function (root, ctx) {
      const sel = root.querySelector('#stu');
      if (sel) sel.addEventListener('change', () => {
        P.state.studentIndex = Number(sel.value);
        ctx.rerender();
      });
      const btn = root.querySelector('[data-action="push"]');
      if (btn) btn.addEventListener('click', () => {
        const all = ctx.data.nutrition.students;
        const s = all[Math.min(P.state.studentIndex || 0, all.length - 1)];
        const box = root.querySelector('#push-result');
        if (box) {
          box.style.marginTop = '12px';
          box.innerHTML = ui.alert('已为「' + s.class_name + ' · ' + s.name + '」生成 ' + s.week +
            ' 营养周报，并推送到家长微信（模拟，不会真的发送）', { ok: true });
        }
        ctx.toast('周报已生成（模拟推送）');
      });
    }
  });

  /* ======================================================= 5. 扩展与接入 */
  P.registerPage({
    id: 'extensions',
    label: '扩展与接入',
    icon: 'plug',
    render: function (ctx) {
      const d = ctx.data.extensions || {};
      const intro = d.intro || {};

      const hero = ui.hero({
        eyebrow: 'CONTROL CENTER / EXTEND',
        title: intro.title || '扩展与接入',
        subtitle: intro.subtitle || '',
        stats: [
          { label: 'PAGES', value: P.pages.length + ' 个', sub: '已注册导航页' },
          { label: 'SLOTS', value: (d.slots || []).length + ' 个', sub: '模块槽位' },
          { label: 'CONTRACT', value: 'JSON', sub: '对接方式' }
        ]
      });

      const slots = (d.slots || []).map(s => {
        const filled = s.status !== '空槽位';
        return '<div class="slot ' + (filled ? 'filled' : '') + '">' +
          '<div class="slot-name">' + esc(s.name) +
          ui.badge(filled ? s.status : '空槽位', filled ? 'accent' : 'muted') + '</div>' +
          '<div class="slot-hint">' + esc(s.hint) + '</div>' +
          '<div class="slot-meta">' + esc(s.type) + ' · 负责人：' + esc(s.owner) + '</div></div>';
      }).join('');

      const contract = (d.contract || []).map(c =>
        '<div class="panel">' +
        '<div class="panel-head"><div><div class="panel-title">' + icon('code', 15) + esc(c.title) + '</div></div></div>' +
        '<div class="code">' + c.lines.map(esc).join('\n') + '</div></div>').join('');

      const g = d.genericDemo || {};
      const demo = ui.panel({
        title: g.name || '通用模块示例',
        sub: '这段是通用渲染器跑出来的，只靠 JSON 配置，没有写任何页面代码',
        tag: 'GENERIC / ZERO-CODE', icon: 'plus',
        body: ui.kpis(g.kpis || []) +
          '<div class="panel-sub" style="margin-top:10px">' + esc(g.note || '') + '</div>'
      });

      const sample = '<div class="panel"><div class="panel-head"><div><div class="panel-title">' +
        icon('link', 15) + '两行代码接入（示例）</div></div></div>' +
        '<div class="code">' +
        esc('// 1) 数据源：把你的算法结果直接推给平台\n') +
        esc("Platform.registerDataSource('queue', async () => ({\n") +
        esc('  windows: [...], trend: { categories: [...], series: [...] }\n') +
        esc('}));\n\n') +
        esc('// 2) 新分项目：注册一个自己的导航页\n') +
        esc("Platform.registerPage({\n  id: 'dish-waste', label: '剩菜监测', icon: 'leaf',\n") +
        esc('  render: (ctx) => \'<div class="panel">...我的板块...</div>\'\n});') +
        '</div></div>';

      return hero +
        ui.panel({ title: '模块槽位', sub: '三个分目标各占一个槽位，另外两个空槽位留给后续新分项目', tag: 'SLOTS', icon: 'grid', body: '<div class="slot-grid">' + slots + '</div>' }) +
        demo +
        '<div class="grid-3">' + contract + '</div>' +
        '<div class="grid-2">' + sample +
        ui.panel({
          title: '扩展规则（给合作方）', sub: '三条约定，保证各干各的也能拼起来', tag: 'RULES', icon: 'shield',
          body: '<div style="font-size:12.5px;color:var(--muted);line-height:2">' +
            '① 只改自己的文件：data/&lt;模块&gt;.json 或 assets/js/modules/&lt;模块&gt;.js，不要动别人的页面<br>' +
            '② 数据结构对齐 docs/INTERFACE.md 里的字段表，字段名不要自创<br>' +
            '③ 时间统一用 <b style="color:var(--text)">YYYY-MM-DD HH:MM</b>，数值统一为数字类型（不要写 "23 人"）<br>' +
            '④ 新增页面必须 registerPage 注册，否则导航里不会出现' +
            '</div>'
        }) + '</div>';
    }
  });

  /* ============================================== 通用模块页（零代码扩展） */
  // 当 data/extensions.json 里出现通用模块时，自动生成页面，无需写代码
  P.buildGenericPages = function () {
    const ext = P.data.extensions || {};
    (ext.slots || []).forEach(function (slot) {
      if (slot.status !== '空槽位' || P.getPage(slot.id)) return;
      const g = ext.genericDemo || {};
      P.registerPage({
        id: slot.id,
        label: slot.name,
        icon: 'plus',
        generic: true,
        render: function () {
          return ui.hero({
            eyebrow: 'CONTROL CENTER / ' + String(slot.id).toUpperCase(),
            title: slot.name,
            subtitle: slot.hint || '等待认领：在 data/extensions.json 里填入配置即可上线',
            stats: [
              { label: 'STATUS', value: slot.status, sub: slot.type },
              { label: 'OWNER', value: slot.owner, sub: '负责人' },
              { label: 'DATA', value: 'JSON', sub: '对接方式' }
            ]
          }) +
            ui.panel({
              title: '占位内容（示例数据）', sub: '把下面的结构换成你的真实数据即可',
              tag: 'PLACEHOLDER', icon: 'plus',
              body: ui.kpis(g.kpis || []) +
                '<div class="panel-sub" style="margin-top:10px">' + esc(g.note || '') + '</div>'
            }) +
            ui.alert('这个页面是通用渲染器自动生成的：在 data/extensions.json 里把该槽位的 status 改成「已接入」并补充字段，就能显示真实内容。');
        }
      });
    });
  };
})(window);

</script>
  <!-- 启动 -->
  <script>
/* ============================================================
   启动 & 外壳（侧边栏 / 顶栏 / 路由）
   ============================================================ */
(function (global) {
  const P = global.Platform;
  const ui = P.ui;
  const esc = P.esc;

  P.state = { studentIndex: 0 };

  const els = {
    sidebar: document.getElementById('sidebar'),
    topbar: document.getElementById('topbar'),
    view: document.getElementById('view'),
    foot: document.getElementById('foot'),
    toast: document.getElementById('toast')
  };

  let toastTimer = null;
  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2600);
  }

  /* ------------------------------------------------------- 导航顺序 */
  function navItems() {
    const order = (P.data.manifest && P.data.manifest.nav) || [];
    const map = {};
    P.pages.forEach(p => { map[p.id] = p; });
    const items = [];
    order.forEach(o => { if (map[o.id]) { items.push(map[o.id]); delete map[o.id]; } });
    Object.keys(map).forEach(k => items.push(map[k]));
    return items;
  }

  /* ------------------------------------------------------- 侧边栏 */
  function renderSidebar(activeId) {
    const m = (P.data.manifest && P.data.manifest.brand) || {};
    const nav = navItems().map(p =>
      '<a class="nav-item' + (p.id === activeId ? ' active' : '') + '" href="#/' + p.id + '" data-id="' + p.id + '">' +
      icon(p.icon || 'grid', 16) + '<span>' + esc(p.label) + '</span></a>').join('');

    const mods = ((P.data.manifest && P.data.manifest.modules) || []).map(mod => {
      const tone = mod.status === 'running' ? 'ok' : mod.status === 'mock' ? 'accent' : 'warn';
      const text = mod.status === 'running' ? '运行中' : mod.status === 'mock' ? '模拟数据' : '待接入';
      return '<div class="status-row"><span>' + esc(mod.name) + '</span><b style="color:' +
        P.toneOf(tone) + '">' + text + '</b></div>';
    }).join('');

    els.sidebar.innerHTML =
      '<div class="brand"><div class="brand-mark">' + icon('grid', 20) + '</div>' +
      '<div><div class="brand-t">' + esc(m.title || '智慧食堂') + '</div>' +
      '<div class="brand-s">' + esc(m.subtitle || 'CONTROL CENTER') + '</div></div></div>' +
      '<div class="side-label">主导航 · NAVIGATION</div>' +
      '<nav class="nav">' + nav + '</nav>' +
      '<div class="side-label">系统状态 · STATUS</div>' +
      '<div class="status-list">' + mods + '</div>' +
      '<div class="side-foot">v' + esc(P.version) + ' · 静态演示版<br>数据源：data/*.json<br>' +
      '三个分模块接口已预留</div>';
  }

  /* ------------------------------------------------------- 顶栏 */
  function renderTopbar(page) {
    els.topbar.innerHTML =
      '<div class="crumb">控制中心 / <b>' + esc(page ? page.label : '') + '</b></div>' +
      '<div class="spacer"></div>' +
      '<span class="pill"><span class="dot"></span>系统运行中</span>' +
      '<button class="icon-btn" id="btn-theme" title="切换深色 / 浅色">' + icon('sun', 14) + '<span>主题</span></button>' +
      '<button class="icon-btn" id="btn-refresh" title="重新读取数据">' + icon('refresh', 14) + '<span>刷新</span></button>';

    els.topbar.querySelector('#btn-theme').addEventListener('click', () => {
      const cur = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = cur;
      try { localStorage.setItem('canteen-theme', cur); } catch (err) { /* 沙箱里忽略 */ }
      toast(cur === 'light' ? '已切换到浅色主题' : '已切换到深色主题');
    });

    els.topbar.querySelector('#btn-refresh').addEventListener('click', async () => {
      await P.load();
      renderPage(P.currentId || 'overview');
      toast('已重新读取 data/*.json');
    });
  }

  function allPages() {
    return navItems();
  }

  /* ------------------------------------------------------- 页脚 */
  function renderFoot() {
    const m = P.data.manifest || {};
    els.foot.innerHTML =
      '<span>演示数据 · 纯静态页面（' + (P.data._inline ? '内联数据' : 'data/*.json') + '），无需后端与安装</span>' +
      '<span>最近更新：' + esc(m.updated || '--') + ' · 平台 v' + esc(P.version) + '</span>';
  }

  /* ------------------------------------------------------- 路由渲染 */
  function renderPage(id) {
    const page = P.getPage(id) || P.pages[0];
    if (!page) {
      els.view.innerHTML = '<div class="empty">还没有注册任何页面</div>';
      return;
    }
    const ctx = {
      data: P.data,
      page: page,
      toast: toast,
      rerender: () => renderPage(page.id)
    };
    try {
      els.view.innerHTML = page.render(ctx) || '';
      if (page.mount) page.mount(els.view, ctx);
    } catch (err) {
      console.error(err);
      els.view.innerHTML = ui.alert('页面渲染出错：' + err.message);
    }
    renderSidebar(page.id);
    renderTopbar(page);
    renderFoot();
    document.title = page.label + ' · 人大附中智慧食堂综合调度中心';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  P.onNavigate = function (id) {
    P.currentId = id;
    renderPage(id);
  };

  // 导航点击：一律拦掉默认跳转，改用内存路由（在 srcdoc / 沙箱 iframe 里也不会报错）
  document.addEventListener('click', function (e) {
    const a = e.target.closest('.nav-item');
    if (!a) return;
    e.preventDefault();
    const id = a.dataset.id;
    if (id && id !== P.currentId) P.navigate(id);
  });

  /* ------------------------------------------------------- 启动 */
  async function start() {
    // boot 内部完成：加载数据 → 应用数据源 → 注册通用模块 → 按 hash 渲染首屏
    await P.boot({});
  }

  start().catch(err => {
    console.error(err);
    els.view.innerHTML = '<div class="empty">启动失败：' + esc(err.message) + '</div>';
  });
})(window);

</script>
</body>
